name: monitor-santander

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (repo público). Privado: "*/30 * * * *"
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python monitor_santander.py --una-vez
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
      - name: Guardar estado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || git commit -m "estado"
          git push
